<ion-app>
  <ion-menu contentId="main-content" side="start" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menú Recordatorios</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">

      <ion-menu-toggle auto-hide="false">

        @for (m of menu; track $index) {
        <ion-item>
          <ion-label [routerLink]="m.ruta">{{m.titulo}}</ion-label>
        </ion-item>
        }

      </ion-menu-toggle>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
