<ion-header class="ion-no-border">

      <h1 class="titulo-pagina">
        <ion-icon name="today-outline"></ion-icon>
        Día
      </h1>
      <p class="subtitulo-pagina">Hola "nombre"</p>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
