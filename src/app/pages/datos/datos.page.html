<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Persistencia de Datos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-grid fixed>
    <ion-row>

      <ion-col size="12">
        <ion-input [(ngModel)]="input" type="text" placeholder="Ingrese texto"></ion-input>
      </ion-col>

      <ion-col size="12">
        <ion-button (click)="guardar()" shape="round" expand="block">
          Guardar texto
        </ion-button>
      </ion-col>

      <ion-col size="12">
        <ion-text>
          <p style="margin-top: 15px; font-size: 1.1rem; color: #4a76b7;">{{ label }}</p>
        </ion-text>
      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
